run_name: 0709_olmoe_baseline
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: olmoe_baseline
  group: null
  entity: wzq142857-apple

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 1
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: true
  include_bias: false
  block_type: moe
  layer_norm_type: rms
  layer_norm_with_affine: true
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: true
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 4096
  vocab_size: 32000
  embedding_size: 32100
  eos_token_id: 0
  pad_token_id: 1
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  moe_top_k: 8
  moe_num_experts: 64
  moe_dropless: true
  moe_mlp_impl: sparse
  moe_zloss_weight: 0.001
  moe_loss_weight: 0.01

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 6.0e-4
  eps: 1.0e-8
  weight_decay: 0.1
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 500
  alpha_f: 0.1
  warmup_min_lr: 0

tokenizer:
  identifier: tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  truncate_direction: right
  hf_custom: /root/.cache/modelscope/hub/models/shakechen/Llama-2-7b-chat-hf

save_folder: /root/paddlejob/ckpts/${run_name}  # doesn't matter since we'll upload to S3
save_overwrite: false
save_interval: 1000
save_num_checkpoints_to_keep: -1
# Unsharded checkpoints (for ddp)
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 15360
global_train_batch_size: 1024
device_train_microbatch_size: 8

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

eval_interval: 2000000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: validation-loss-sync
    data:
      num_workers: 0
      drop_last: true
      datasets:
        stackexchange:
          - /root/paddlejob/data/stackexchange/

data:
  pad_direction: right
  num_workers: 0
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  instance_filter:
    repetition_max_period: 13
    repetition_min_period: 1
    repetition_max_count: 32
  paths:
    - /root/paddlejob/redpajama/for_ft/arxiv
    - /root/paddlejob/redpajama/for_ft/book
    - /root/paddlejob/redpajama/for_ft/c4-rp
    - /root/paddlejob/redpajama/for_ft/cc
    - /root/paddlejob/redpajama/for_ft/github
    - /root/paddlejob/redpajama/for_ft/stackexchange
    - /root/paddlejob/redpajama/for_ft/wiki
  proportions:
    - 0.007
    - 0.091
    - 0.492
    - 0.361
    - 0.008
    - 0.01
    - 0.031
  dataset_name: stream